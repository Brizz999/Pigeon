name: Issue report
description: Report a problem with Pigeon
labels:
  - issue-report
body:
  - type: checkboxes
    id: acknowledgments
    attributes:
      label: Checklist
      options:
        - label: I'm reporting a problem with Pigeon.
          required: true
        - label: I've searched the existing issues and pull requests for a similar report.
          required: true

  - type: textarea
    id: description
    validations:
      required: true
    attributes:
      label: Describe the problem
      description: Explain what happened, what you expected, and how to reproduce it.
      placeholder: |
        Steps to reproduce:
        1. ...

        Expected result:
        ...

        Actual result:
        ...

  - type: textarea
    id: profiles
    attributes:
      label: Relevant profile configuration
      description: >-
        If useful, attach a safe profile export. Do not export with webhooks or
        include webhook URLs in this report.

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Add screenshots or video that help explain the problem.

  - type: textarea
    id: logs
    attributes:
      label: RuneLite logs
      description: >-
        Logs are in %userprofile%\.runelite\logs on Windows and
        $HOME/.runelite/logs on Linux and macOS. Before uploading, remove
        webhook URLs, account details, and any other credentials or personal
        information.

  - type: input
    id: versions
    validations:
      required: true
    attributes:
      label: Versions
      description: Provide both the Pigeon and RuneLite versions.
      placeholder: "Pigeon: 0.1.0; RuneLite: 1.x.x"

  - type: dropdown
    id: operating-system
    validations:
      required: true
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
