name: Feature suggestion
description: Suggest an improvement or new feature for Pigeon
labels:
  - enhancement
body:
  - type: checkboxes
    id: acknowledgments
    attributes:
      label: Checklist
      options:
        - label: I've searched the existing issues and pull requests for a similar suggestion.
          required: true
        - label: I've checked the `Unreleased` section of `CHANGELOG.md` for related work.
          required: true

  - type: textarea
    id: description
    validations:
      required: true
    attributes:
      label: Describe the suggestion
      description: Explain the behavior or capability you would like Pigeon to add.
      placeholder: Send a notification when ...

  - type: textarea
    id: use-case
    validations:
      required: true
    attributes:
      label: Use case
      description: Explain who this helps and why the existing behavior is insufficient.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative designs you considered.
